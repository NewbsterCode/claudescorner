<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tidepool</title>
<style>
  :root { --bg:#0b1320; --panel:#121c2e; --ink:#d8e2f0; --dim:#7f8fa8; --accent:#5ec8b8; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.4 system-ui, sans-serif; display:flex; height:100vh; overflow:hidden; }
  #world { flex:1 1 0; min-width:0; min-height:0; display:block; cursor:crosshair; }   /* min 0: else the canvas grows to its own pixel width and pushes the panel off-screen */
  aside { flex:none; width:260px; background:var(--panel); padding:16px; overflow-y:auto; border-left:1px solid #1e2b42; }
  h1 { font-size:18px; margin:0 0 4px; color:var(--accent); }
  p.sub { margin:0 0 16px; color:var(--dim); font-size:12px; }
  .stat { display:flex; justify-content:space-between; padding:3px 0; border-bottom:1px solid #1a263a; }
  .stat span:last-child { font-variant-numeric: tabular-nums; }
  button { background:#1c2a42; color:var(--ink); border:1px solid #2a3b5a; border-radius:6px; padding:6px 10px; cursor:pointer; margin:2px 2px 2px 0; }
  button:hover { border-color:var(--accent); }
  label { display:block; margin-top:12px; color:var(--dim); font-size:12px; }
  input[type=range] { width:100%; }
  select { width:100%; margin-top:4px; background:#1c2a42; color:var(--ink); border:1px solid #2a3b5a; border-radius:6px; padding:4px; }
  #pools { margin-top:8px; font-size:12px; }
  #pools .stat span:first-child { color:var(--dim); }
  #graph { width:100%; height:80px; background:#0d1626; border-radius:6px; margin-top:12px; }
  #inspect { margin-top:12px; font-size:12px; color:var(--dim); white-space:pre-line; min-height:4em; }
  @media (max-width:700px){ body{flex-direction:column} aside{width:100%;height:40vh;border-left:0;border-top:1px solid #1e2b42} }
</style>
</head>
<body>
<canvas id="world"></canvas>
<aside>
  <h1>Tidepool</h1>
  <p class="sub">Small creatures with tiny neural-net brains. Nobody programs them to find food; the ones whose brains happen to work have more offspring.</p>
  <div class="stat"><span>Time</span><span id="sTime">0</span></div>
  <div class="stat"><span>Population</span><span id="sPop">0</span></div>
  <div class="stat"><span>Food</span><span id="sFood">0</span></div>
  <div class="stat"><span>Deepest generation</span><span id="sGen">0</span></div>
  <div class="stat"><span>Avg. lifetime food</span><span id="sEat">0</span></div>
  <div class="stat"><span>Lineages alive</span><span id="sLin">0</span></div>
  <canvas id="graph"></canvas>
  <div style="margin-top:12px">
    <button id="bPause">Pause</button><button id="bReset">Reset</button><button id="bTrails">Trails</button>
    <button id="bInvade" title="Drop 8 meat-eating predators into a pool">Release predators</button>
  </div>
  <label>World <select id="sWorld">
    <option value="pools:40">Three pools, linked by gaps</option>
    <option value="pools:0">Three pools, sealed</option>
    <option value="open:0">Open water (no walls)</option>
  </select></label>
  <label>Release into <select id="sIPool"><option value="-1">anywhere</option><option value="0">pool A (rich)</option><option value="1">pool B</option><option value="2">pool C (poor)</option></select></label>
  <label>Predator brains <select id="sIBrain" title="Trained brains are bred in a small hunting arena first; takes a few seconds the first time">
    <option value="random">random</option><option value="local">borrowed from residents</option><option value="trained">trained hunters</option></select></label>
  <div id="pools"></div>
  <label>Simulation speed <span id="lSpeed">1×</span><input id="rSpeed" type="range" min="1" max="20" value="1"></label>
  <label>Food growth <span id="lFood">1.0</span><input id="rFood" type="range" min="0" max="30" value="10"></label>
  <label>Mutation rate <span id="lMut">0.10</span><input id="rMut" type="range" min="0" max="50" value="10"></label>
  <div id="inspect">Click a creature to inspect it. Click empty water to drop food.</div>
</aside>
<script>
"use strict";
// ---------- setup ----------
const cv = document.getElementById('world'), ctx = cv.getContext('2d');
const gv = document.getElementById('graph'), gctx = gv.getContext('2d');
let W = 0, H = 0;
function resize() {
  W = cv.width = cv.clientWidth; H = cv.height = cv.clientHeight;
  gv.width = gv.clientWidth; gv.height = gv.clientHeight;
}
resize();

const $ = id => document.getElementById(id);
// ---------- config (URL params, so tools/headless.js can run sweeps) ----------
// ?seed=N  repeatable runs   ?world=open|pools   ?gap=PX (0 seals the pools)   ?rich=a,b,c food per pool   ?predators=0|1
// Predator invasion experiments: ?invade=T releases the seeded predators at tick T instead of at the start,
// ?ipool=i only into pool i, ?ibrain=random|local (random brains, or brains copied from local creatures),
// ?reseed=0 gives them one shot (no topping up when they die out).
// ?vexp=E: top speed scales as (size/3)^-E. Default 0.5 (big bodies are slower); 0 = all sizes equally fast.
// Gut tradeoff shape. With s = gut - 0.5 in [0,1], plant value = 0.5 + s^K and meat value = 0.5 + (1-s)^K.
// ?gutk=K: K=1 (default) is the old linear tradeoff; K>1 makes generalists worse at both, so it pays to specialize.
// ?plantmin=G: guts below G can't digest plants at all (default 0.5 = off).
// ?meatx=M multiplies the energy a kill pays to a carnivore gut (< 0.85) only, so residents' cannibalism is unchanged (default 1).
const Q = (() => { try { return new URLSearchParams(location.search); } catch (e) { return new URLSearchParams(''); } })();
const num = (k, d) => Q.has(k) && isFinite(+Q.get(k)) ? +Q.get(k) : d;
const cfg = {
  world: Q.get('world') === 'open' ? 'open' : 'pools',
  gap: Math.max(0, num('gap', 40)),
  rich: (Q.get('rich') || '1.6,1,0.5').split(',').map(Number).filter(v => isFinite(v) && v >= 0),
  predators: num('predators', 1) !== 0,
  invade: Math.max(0, Math.floor(num('invade', 0))),
  ipool: Q.has('ipool') ? Math.floor(num('ipool', 0)) : -1,
  ibrain: ['local', 'trained'].includes(Q.get('ibrain')) ? Q.get('ibrain') : 'random',
  reseed: num('reseed', 1) !== 0,
  vexp: num('vexp', 0.5),
  gutk: Math.max(0.1, num('gutk', 1)),
  plantmin: num('plantmin', 0.5),
  meatx: Math.max(0, num('meatx', 1)),
};
// how much a gut gets from plants and from meat (multipliers); K=1 keeps the exact old expressions
const plantGain = gut => gut < cfg.plantmin ? 0 : cfg.gutk === 1 ? gut : 0.5 + Math.pow(gut - 0.5, cfg.gutk);
const meatGain = gut => cfg.gutk === 1 ? 2 - gut : 0.5 + Math.pow(1.5 - gut, cfg.gutk);
if (!cfg.rich.length) cfg.rich = [1.6, 1, 0.5];
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rnd = Q.has('seed') ? mulberry32(num('seed', 1)) : Math.random;
const rand = (a = 1, b) => b === undefined ? rnd() * a : a + rnd() * (b - a);
const gauss = () => { let u = 0, v = 0; while (!u) u = rnd(); while (!v) v = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
const wrapD = (d, L) => d > L / 2 ? d - L : d < -L / 2 ? d + L : d;

// ---------- brain ----------
// inputs: food L, food R, food ahead, prey L, prey R, threat, crowd, energy, bias -> hidden(8) -> turn, thrust
const NI = 9, NH = 8, NO = 2;
const NW = NI * NH + NH * NO;
function newGenome() {
  const w = new Float32Array(NW); for (let i = 0; i < NW; i++) w[i] = gauss() * 0.8;
  return { w, size: rand(3, 6), hue: rand(360), sense: rand(25, 45), gut: rand(0.6, 1.5) };
}
function mutate(g, rate) {
  const w = Float32Array.from(g.w);
  for (let i = 0; i < NW; i++) if (rnd() < 0.3) w[i] += gauss() * rate * 3;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  return {
    w,
    size: clamp(g.size + gauss() * rate * 2, 2, 10),
    hue: (g.hue + gauss() * rate * 40 + 360) % 360,
    sense: clamp(g.sense + gauss() * rate * 15, 10, 90),
    gut: clamp(g.gut + gauss() * rate * 1.0, 0.5, 1.5),
  };
}
const hid = new Float32Array(NH);
function think(w, inp, out) {
  for (let h = 0; h < NH; h++) { let s = 0; for (let i = 0; i < NI; i++) s += inp[i] * w[h * NI + i]; hid[h] = Math.tanh(s); }
  const o = NI * NH;
  for (let k = 0; k < NO; k++) { let s = 0; for (let h = 0; h < NH; h++) s += hid[h] * w[o + k * NH + h]; out[k] = Math.tanh(s); }
}

// ---------- world ----------
const CELL = 30;
let migrations = 0, invaderLineages = new Set(), founderLog = [], trainedLineages = new Set();   // founderLog: released predators at death
let food, creatures, tick, nextLineage, grid, gw, gh, history, selected;
const params = { speed: 1, foodRate: 1.0, mut: 0.10, paused: false, trails: false, predators: cfg.predators };

// ---------- pools: walls split the world into vertical strips, each with its own food richness ----------
// Walls sit at x = 0 (the wrap seam), W/n, 2W/n, ... Each has one gap of cfg.gap px. A wall is WALL px thick,
// thicker than any creature's reach, so nothing can eat or be eaten through one.
const WALL = 16;
let zones = [];   // { x0, x1, mult }
let walls = [];   // { x, gy }: wall centre x and gap centre y
function buildZones() {
  if (cfg.world === 'open') { zones = [{ x0: 0, x1: W, mult: 1 }]; walls = []; return; }
  const n = cfg.rich.length, zw = W / n;
  zones = cfg.rich.map((mult, i) => ({ x0: i * zw, x1: (i + 1) * zw, mult }));
  walls = cfg.rich.map((_, i) => ({ x: i * zw, gy: H * (0.25 + 0.5 * i / Math.max(1, n - 1)) }));
}
const zoneOf = x => zones.length === 1 ? 0 : Math.min(zones.length - 1, Math.floor(((x % W + W) % W) / (W / zones.length)));
function blocked(x, y) {
  for (const w of walls) if (Math.abs(wrapD(x - w.x, W)) < WALL / 2 && Math.abs(y - w.gy) >= cfg.gap / 2) return true;
  return false;
}
function freePoint(x0 = 0, x1 = W) { for (;;) { const x = rand(x0, x1), y = rand(H); if (!blocked(x, y)) return [x, y]; } }

function reset() {
  food = []; creatures = []; tick = 0; nextLineage = 0; history = []; selected = null; migrations = 0; invaderLineages = new Set(); founderLog = []; trainedLineages = new Set();
  buildZones();
  for (let i = 0; i < 600; i++) { const [x, y] = freePoint(); food.push({ x, y, e: 1 }); }
  for (let i = 0; i < 60; i++) spawn(newGenome(), ...freePoint(), 0, nextLineage++);
  if (params.predators && cfg.invade === 0) releasePredators(8);
}
// where predators may be released: one pool if ?ipool is set (and exists), else anywhere
function predatorRange() { const z = zones[cfg.ipool]; return z ? [z.x0, z.x1] : [0, W]; }
function releasePredators(n) {
  const [x0, x1] = predatorRange();
  for (let i = 0; i < n; i++) {
    const g = newPredator(), [x, y] = freePoint(x0, x1);   // this order keeps old seeded runs identical
    if (cfg.ibrain === 'local') {   // borrow the brain of a resident of that pool, so the invader can at least swim and steer
      const z = zoneOf(x), locals = creatures.filter(c => c.zone === z && c.g.gut >= 0.85);
      if (locals.length) g.w = Float32Array.from(locals[(rnd() * locals.length) | 0].g.w);
    } else if (cfg.ibrain === 'trained') {   // a brain bred in the hunter arena (trained once, then reused)
      const t = trainLog || trainHunters();
      g.w = Float32Array.from(t.brains[i % t.brains.length]);
      trainedLineages.add(nextLineage);
    }
    invaderLineages.add(nextLineage);
    spawn(g, x, y, 0, nextLineage++, 250);
    creatures[creatures.length - 1].founder = true;
  }
}
// ---------- hunter training arena (?ibrain=trained) ----------
// Borrowed forager brains don't chase prey, so before release we evolve hunting brains in a small, empty arena:
// one hunter at a time among harmless drifting prey (size 3-4.5, never fight back, respawn when eaten) and
// plants at the main world's density. Same senses, same think(), same speed/turn rules as the real world.
// Fitness = kills in TRAIN_T ticks. (mu+lambda) evolution: keep the best quarter, refill with mutants.
// Uses its own seeded PRNG, so the main world's random stream stays exactly as it would be with ibrain=random.
const TRAIN_POP = 16, TRAIN_GENS = num('tgens', 30), TRAIN_T = 500, AR = 360;
let trainLog = null;   // { gens, best: [kills per generation], brains: [...] }
function trainHunters() {
  const r = mulberry32(Q.has('seed') ? num('seed', 1) * 7919 + 13 : (Math.random() * 2 ** 32) | 0), rr = (a, b) => a + r() * (b - a);
  const gs = () => { let u = 0, v = 0; while (!u) u = r(); while (!v) v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
  const wd = d => d > AR / 2 ? d - AR : d < -AR / 2 ? d + AR : d;
  const mk = () => { const w = new Float32Array(NW); for (let i = 0; i < NW; i++) w[i] = gs() * 0.8; return w; };
  const mut = w => { const m = Float32Array.from(w); for (let i = 0; i < NW; i++) if (r() < 0.3) m[i] += gs() * 0.3; return m; };
  const ti = new Float32Array(NI), to = new Float32Array(NO);
  function trial(w, size, sense) {
    const prey = Array.from({ length: 14 }, () => ({ x: rr(0, AR), y: rr(0, AR), a: rr(0, 6.28), s: rr(3, 4.5) }));
    const plants = Array.from({ length: Math.round(AR * AR / 900) }, () => [rr(0, AR), rr(0, AR)]);
    const h = { x: AR / 2, y: AR / 2, a: 0, e: 150 }; let kills = 0;
    const cnt = (x, y, rad) => { let n = 0; for (const p of plants) { const dx = wd(p[0] - x), dy = wd(p[1] - y); if (dx * dx + dy * dy < rad * rad) n++; } return n; };
    for (let t = 0; t < TRAIN_T; t++) {
      for (const p of prey) { p.a += gs() * 0.2; p.x = (p.x + Math.cos(p.a) * 1.2 + AR) % AR; p.y = (p.y + Math.sin(p.a) * 1.2 + AR) % AR; }
      const s = sense, ca = Math.cos(h.a), sa = Math.sin(h.a);
      ti[0] = Math.min(1, cnt(h.x + Math.cos(h.a - 0.6) * s, h.y + Math.sin(h.a - 0.6) * s, s * 0.6) / 4);
      ti[1] = Math.min(1, cnt(h.x + Math.cos(h.a + 0.6) * s, h.y + Math.sin(h.a + 0.6) * s, s * 0.6) / 4);
      ti[2] = Math.min(1, cnt(h.x + ca * s * 2, h.y + sa * s * 2, s * 0.8) / 6);
      let pl = 0, pr = 0, crowd = 0;
      for (const p of prey) {
        const dx = wd(p.x - h.x), dy = wd(p.y - h.y), d = Math.hypot(dx, dy);
        if (d >= s * 1.5) continue;
        crowd++;
        if (dx * ca + dy * sa > 0) { if (ca * dy - sa * dx < 0) pl += 1 - d / (s * 1.5); else pr += 1 - d / (s * 1.5); }
      }
      ti[3] = Math.min(1, pl); ti[4] = Math.min(1, pr); ti[5] = 0; ti[6] = Math.min(1, crowd / 6);
      ti[7] = Math.min(1, h.e / 150); ti[8] = 1;
      think(w, ti, to);
      h.a += to[0] * 0.25;
      const v = (to[1] + 1) * 0.5 * 3.2 * Math.pow(size / 3, -cfg.vexp);
      h.x = (h.x + Math.cos(h.a) * v + AR) % AR; h.y = (h.y + Math.sin(h.a) * v + AR) % AR;
      h.e = Math.max(0, h.e - (0.008 * size * size + 0.012 * v * v * size + 0.0015 * sense));
      for (const p of prey) {
        const dx = wd(p.x - h.x), dy = wd(p.y - h.y);
        if (dx * dx + dy * dy < (size + 2) ** 2) { kills++; h.e += 60; p.x = rr(0, AR); p.y = rr(0, AR); }
      }
    }
    return kills;
  }
  // every brain is scored on the same three body plans, so fitness doesn't depend on a lucky body
  const bodies = [[7, 45], [7.75, 52], [8.5, 60]];
  const score = w => bodies.reduce((s, b) => s + trial(w, b[0], b[1]), 0) / bodies.length;
  let pop = Array.from({ length: TRAIN_POP }, () => ({ w: mk() }));
  const best = [];
  for (let gen = 0; gen < TRAIN_GENS; gen++) {
    for (const b of pop) if (b.f === undefined) b.f = score(b.w);
    pop.sort((a, b) => b.f - a.f);
    best.push(+pop[0].f.toFixed(1));
    const keep = pop.slice(0, TRAIN_POP / 4);
    pop = keep.concat(Array.from({ length: TRAIN_POP - keep.length }, (_, i) => ({ w: mut(keep[i % keep.length].w) })));
  }
  for (const b of pop) if (b.f === undefined) b.f = score(b.w);
  pop.sort((a, b) => b.f - a.f);
  // what a random brain scores in the same arena, for comparison
  const baseline = Array.from({ length: 8 }, () => score(mk())).reduce((a, b) => a + b, 0) / 8;
  trainLog = { gens: TRAIN_GENS, best, baseline: +baseline.toFixed(1), brains: pop.slice(0, TRAIN_POP / 4).map(b => b.w) };
  return trainLog;
}
function newPredator() { return { ...newGenome(), size: rand(7, 8.5), gut: rand(0.5, 0.7), sense: rand(45, 60), hue: rand(340, 380) % 360 }; }
function spawn(g, x, y, gen, lineage, energy = 60) {
  creatures.push({ g, x, y, a: rand(Math.PI * 2), v: 0, energy, age: 0, gen, lineage, eaten: 0, kids: 0, kills: 0, zone: zoneOf(x) });
}

function buildGrid() {
  gw = Math.ceil(W / CELL); gh = Math.ceil(H / CELL);
  grid = Array.from({ length: gw * gh }, () => []);
  for (const f of food) {
    const cx = Math.min(gw - 1, (f.x / CELL) | 0), cy = Math.min(gh - 1, (f.y / CELL) | 0);
    grid[cy * gw + cx].push(f);
  }
}
// visit food within radius r of (x,y), toroidal
function nearFood(x, y, r, fn) {
  const c0x = Math.floor((x - r) / CELL), c1x = Math.floor((x + r) / CELL);
  const c0y = Math.floor((y - r) / CELL), c1y = Math.floor((y + r) / CELL);
  const r2 = r * r;
  for (let cy = c0y; cy <= c1y; cy++) for (let cx = c0x; cx <= c1x; cx++) {
    const cell = grid[((cy % gh + gh) % gh) * gw + ((cx % gw + gw) % gw)];
    for (const f of cell) {
      if (f.e <= 0) continue;
      const dx = wrapD(f.x - x, W), dy = wrapD(f.y - y, H);
      if (dx * dx + dy * dy < r2) fn(f, dx, dy);
    }
  }
}
function countFood(x, y, r) { let n = 0; nearFood(x, y, r, () => n++); return n; }

const inp = new Float32Array(NI), out = new Float32Array(NO);
function step() {
  tick++;
  // food regrows in each pool at its own rate, slightly clumped near existing food
  const byZone = zones.map(() => []);
  for (const f of food) byZone[zoneOf(f.x)].push(f);
  zones.forEach((z, zi) => {
    const list = byZone[zi], share = (z.x1 - z.x0) / W;
    const target = params.foodRate * z.mult * share * (W * H) / 900;
    z.acc = (z.acc || 0) + params.foodRate * 4 * z.mult * share;   // fractional rates accumulate across ticks
    for (; z.acc >= 1; z.acc--) {
      if (list.length >= target) { z.acc = 0; break; }
      let x, y;
      if (list.length && rnd() < 0.7) { const p = list[(rnd() * list.length) | 0]; x = (p.x + gauss() * 20 + W) % W; y = (p.y + gauss() * 20 + H) % H; }
      else { x = rand(z.x0, z.x1); y = rand(H); }
      if (zoneOf(x) !== zi || blocked(x, y)) continue;   // that seed landed in a wall or the next pool
      const f = { x, y, e: 1 }; food.push(f); list.push(f);
    }
  });
  buildGrid();

  // creature grid, for sensing each other and for predation
  const CC = 60, cgw = Math.ceil(W / CC), cgh = Math.ceil(H / CC);
  const cgrid = Array.from({ length: cgw * cgh }, () => []);
  for (const c of creatures) cgrid[Math.min(cgh - 1, (c.y / CC) | 0) * cgw + Math.min(cgw - 1, (c.x / CC) | 0)].push(c);
  const nearCreatures = (c, r, fn) => {
    const r2 = r * r, cx0 = Math.floor((c.x - r) / CC), cx1 = Math.floor((c.x + r) / CC);
    const cy0 = Math.floor((c.y - r) / CC), cy1 = Math.floor((c.y + r) / CC);
    for (let cy = cy0; cy <= cy1; cy++) for (let cx = cx0; cx <= cx1; cx++)
      for (const o of cgrid[((cy % cgh + cgh) % cgh) * cgw + ((cx % cgw + cgw) % cgw)]) {
        if (o === c || o.energy <= 0) continue;
        const dx = wrapD(o.x - c.x, W), dy = wrapD(o.y - c.y, H), d2 = dx * dx + dy * dy;
        if (d2 < r2) fn(o, dx, dy, Math.sqrt(d2));
      }
  };
  const PREY_RATIO = 1.25;   // you can eat anything this many times smaller than you

  const born = [];
  for (const c of creatures) {
    const g = c.g, s = g.sense;
    const lx = c.x + Math.cos(c.a - 0.6) * s, ly = c.y + Math.sin(c.a - 0.6) * s;
    const rx = c.x + Math.cos(c.a + 0.6) * s, ry = c.y + Math.sin(c.a + 0.6) * s;
    const fx = c.x + Math.cos(c.a) * s * 2, fy = c.y + Math.sin(c.a) * s * 2;
    inp[0] = Math.min(1, countFood(lx, ly, s * 0.6) / 4);
    inp[1] = Math.min(1, countFood(rx, ry, s * 0.6) / 4);
    inp[2] = Math.min(1, countFood(fx, fy, s * 0.8) / 6);
    if (c.energy <= 0) continue;   // eaten earlier this tick
    let preyL = 0, preyR = 0, threat = 0, crowd = 0;
    const ca = Math.cos(c.a), sa = Math.sin(c.a);
    nearCreatures(c, s * 1.5, (o, dx, dy, d) => {
      const close = 1 - d / (s * 1.5);
      crowd++;
      if (o.g.size * PREY_RATIO < g.size && dx * ca + dy * sa > 0) {   // smaller, and in front
        if (ca * dy - sa * dx < 0) preyL += close; else preyR += close;
      } else if (o.g.size > g.size * PREY_RATIO) threat = Math.max(threat, close);
    });
    inp[3] = Math.min(1, preyL); inp[4] = Math.min(1, preyR); inp[5] = threat;
    inp[6] = Math.min(1, crowd / 6);
    inp[7] = Math.min(1, c.energy / 150);
    inp[8] = 1;
    think(g.w, inp, out);
    c.a += out[0] * 0.25;
    c.v = (out[1] + 1) * 0.5 * 3.2 * Math.pow(g.size / 3, -cfg.vexp);
    const nx = (c.x + Math.cos(c.a) * c.v + W) % W, ny = (c.y + Math.sin(c.a) * c.v + H) % H;
    if (walls.length && blocked(nx, ny) && !blocked(c.x, c.y)) c.a = Math.PI - c.a;   // bounce off the wall
    else {
      c.x = nx; c.y = ny;
      const z = zoneOf(c.x);
      if (z !== c.zone) { c.zone = z; migrations++; }
    }
    // metabolism: bigger bodies and longer senses cost more, speed costs quadratically
    c.energy -= 0.008 * g.size * g.size + 0.012 * c.v * c.v * g.size + 0.0015 * g.sense;
    // eat
    nearFood(c.x, c.y, g.size + 2, f => { f.e = 0; c.energy += 12 * plantGain(g.gut); c.eaten++; });
    // hunt: swallow a small enough creature that you touch. Meat is worth more to a carnivorous gut.
    nearCreatures(c, g.size + 2, o => {
      if (o.g.size * PREY_RATIO < g.size && o.energy > 0) {
        c.energy += (o.energy * 0.5 + o.g.size * 8) * meatGain(g.gut) * (g.gut < 0.85 ? cfg.meatx : 1); c.kills++; o.energy = 0; o.eatenBy = true;
      }
    });
    c.age++;
    // reproduce
    const threshold = 80 + g.size * 12;
    if (c.energy > threshold) {
      const gift = c.energy * 0.45;     // child gets 45%, 10% lost to the cost of reproducing
      c.energy *= 0.45; c.kids++;
      born.push([mutate(g, params.mut), c.x, c.y, c.gen + 1, c.lineage, gift]);
    }
  }
  for (const b of born) spawn(...b);
  // dead creatures become a little food
  for (const c of creatures) if (c.energy <= 0 || c.age > 6000) {
    if (c === selected) selected = null;
    if (c.founder) founderLog.push({ age: c.age, kills: c.kills, kids: c.kids, eaten: c.eaten, tick });
    if (!c.eatenBy) for (let i = 0; i < 2; i++) food.push({ x: c.x, y: c.y, e: 1 });
  }
  creatures = creatures.filter(c => c.energy > 0 && c.age <= 6000);
  food = food.filter(f => f.e > 0);
  // keep the pool from going fully extinct
  if (params.predators && cfg.invade && tick === cfg.invade) releasePredators(8);
  if (params.predators && cfg.reseed && tick >= cfg.invade && tick % 500 === 0 && creatures.filter(c => c.g.gut < 0.85).length < 3)
    releasePredators(3);
  if (creatures.length < 8) for (let i = 0; i < 4; i++) spawn(newGenome(), ...freePoint(), 0, nextLineage++);
  // a pool that empties out (easy when sealed) gets a few random colonists, like seeds blown in
  if (zones.length > 1 && tick % 500 === 0) zones.forEach((z, zi) => {
    if (creatures.filter(c => c.zone === zi && c.g.gut >= 0.85).length < 3)
      for (let i = 0; i < 4; i++) spawn(newGenome(), ...freePoint(z.x0, z.x1), 0, nextLineage++);
  });
  if (tick % 20 === 0) { history.push(creatures.length); if (history.length > 300) history.shift(); }
}

// ---------- rendering ----------
function draw() {
  if (params.trails) { ctx.fillStyle = 'rgba(11,19,32,0.12)'; ctx.fillRect(0, 0, W, H); }
  else { ctx.fillStyle = '#0b1320'; ctx.fillRect(0, 0, W, H); }
  // pools: tint by richness, then the walls
  zones.forEach(z => { if (zones.length > 1) { ctx.fillStyle = `rgba(63,143,74,${0.03 * z.mult})`; ctx.fillRect(z.x0, 0, z.x1 - z.x0, H); } });
  ctx.fillStyle = '#24344f';
  for (const w of walls) {
    const top = w.gy - cfg.gap / 2, bot = w.gy + cfg.gap / 2;
    for (const x of [w.x, w.x + W]) {   // the seam wall at x=0 is drawn on both edges
      ctx.fillRect(x - WALL / 2, 0, WALL, top); ctx.fillRect(x - WALL / 2, bot, WALL, H - bot);
    }
  }
  ctx.fillStyle = '#3f8f4a';
  for (const f of food) ctx.fillRect(f.x - 1.5, f.y - 1.5, 3, 3);
  for (const c of creatures) {
    const g = c.g, light = 45 + Math.min(25, c.energy / 6);
    ctx.fillStyle = `hsl(${g.hue},70%,${light}%)`;
    ctx.beginPath(); ctx.arc(c.x, c.y, g.size, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = `hsla(${g.hue},70%,70%,0.5)`; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(c.x, c.y); ctx.lineTo(c.x + Math.cos(c.a - 0.6) * g.sense * 0.5, c.y + Math.sin(c.a - 0.6) * g.sense * 0.5);
    ctx.moveTo(c.x, c.y); ctx.lineTo(c.x + Math.cos(c.a + 0.6) * g.sense * 0.5, c.y + Math.sin(c.a + 0.6) * g.sense * 0.5);
    ctx.stroke();
  }
  if (selected) {
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(selected.x, selected.y, selected.g.size + 6, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([3, 4]); ctx.beginPath(); ctx.arc(selected.x, selected.y, selected.g.sense, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
  }
}
function drawGraph() {
  const w = gv.width, h = gv.height; gctx.clearRect(0, 0, w, h);
  if (history.length < 2) return;
  const max = Math.max(...history) * 1.1;
  gctx.strokeStyle = '#5ec8b8'; gctx.lineWidth = 1.5; gctx.beginPath();
  history.forEach((v, i) => { const x = i / (history.length - 1) * w, y = h - v / max * (h - 4) - 2; i ? gctx.lineTo(x, y) : gctx.moveTo(x, y); });
  gctx.stroke();
  gctx.fillStyle = '#7f8fa8'; gctx.font = '10px system-ui'; gctx.fillText('population', 4, 12);
}
function updateStats() {
  $('sTime').textContent = tick.toLocaleString();
  $('sPop').textContent = creatures.length;
  $('sFood').textContent = food.length;
  $('sGen').textContent = creatures.reduce((m, c) => Math.max(m, c.gen), 0);
  const adults = creatures.filter(c => c.age > 300);
  $('sEat').textContent = adults.length ? (adults.reduce((s, c) => s + c.eaten / c.age * 1000, 0) / adults.length).toFixed(1) + ' /1k' : '–';
  $('sLin').textContent = new Set(creatures.map(c => c.lineage)).size;
  $('pools').innerHTML = zones.length < 2 ? '' : zones.map((z, i) => {
    const p = creatures.filter(c => c.zone === i), med = k => p.length ? p.map(c => c.g[k]).sort((a, b) => a - b)[p.length >> 1] : 0;
    return `<div class="stat"><span>Pool ${'ABCDEFGH'[i] || i + 1} (food ×${z.mult})</span><span>${p.length} · size ${med('size').toFixed(1)}</span></div>`;
  }).join('') + `<div class="stat"><span>Crossings</span><span>${migrations}</span></div>`;
  if (selected) {
    const c = selected;
    $('inspect').textContent =
      `Lineage #${c.lineage}, generation ${c.gen}\nAge ${c.age}  ·  energy ${c.energy.toFixed(0)}\n` +
      `Size ${c.g.size.toFixed(1)}  ·  sense ${c.g.sense.toFixed(0)}px\nGut ${c.g.gut > 1.15 ? 'plant-eater' : c.g.gut < 0.85 ? 'meat-eater' : 'omnivore'} (${c.g.gut.toFixed(2)})
Plants ${c.eaten}  ·  kills ${c.kills}  ·  offspring ${c.kids}` +
      (invaderLineages.has(c.lineage) ? `\nReleased predator lineage${trainedLineages.has(c.lineage) && trainLog ? ` (arena-bred: ${trainLog.best[trainLog.best.length - 1]} kills/trial vs ${trainLog.baseline} for a random brain)` : ''}` : '');
  }
}

// ---------- controls ----------
$('bPause').onclick = () => { params.paused = !params.paused; $('bPause').textContent = params.paused ? 'Resume' : 'Pause'; };
$('bReset').onclick = reset;
$('sWorld').value = cfg.world + ':' + (cfg.world === 'open' ? 0 : cfg.gap);
if (!$('sWorld').value) $('sWorld').selectedIndex = 0;
$('sWorld').onchange = e => { const [w, g] = e.target.value.split(':'); cfg.world = w; cfg.gap = +g; reset(); };
addEventListener('resize', () => { resize(); buildZones(); });
$('sIPool').value = String(cfg.ipool); if (!$('sIPool').value) $('sIPool').value = '-1';
$('sIPool').onchange = e => { cfg.ipool = +e.target.value; };
$('sIBrain').value = cfg.ibrain;
$('sIBrain').onchange = e => { cfg.ibrain = e.target.value; };
$('bInvade').onclick = () => {
  if (cfg.ibrain !== 'trained' || trainLog) return releasePredators(8);
  $('bInvade').textContent = 'Training hunters…';   // the arena blocks for a few seconds the first time; let the label paint first
  setTimeout(() => { releasePredators(8); $('bInvade').textContent = 'Release predators'; }, 30);
};
$('bTrails').onclick = () => { params.trails = !params.trails; };
$('rSpeed').oninput = e => { params.speed = +e.target.value; $('lSpeed').textContent = params.speed + '×'; };
$('rFood').oninput = e => { params.foodRate = e.target.value / 10; $('lFood').textContent = params.foodRate.toFixed(1); };
$('rMut').oninput = e => { params.mut = e.target.value / 100; $('lMut').textContent = params.mut.toFixed(2); };
cv.addEventListener('click', e => {
  const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  let best = null, bd = 400;
  for (const c of creatures) { const d = (c.x - x) ** 2 + (c.y - y) ** 2; if (d < bd) { bd = d; best = c; } }
  if (best) { selected = best; return; }
  for (let i = 0; i < 40; i++) { const fx = (x + gauss() * 15 + W) % W, fy = (y + gauss() * 15 + H) % H; if (!blocked(fx, fy)) food.push({ x: fx, y: fy, e: 1 }); }
});

// ---------- loop ----------
reset();
let frame = 0;
function loop() {
  if (!params.paused) for (let i = 0; i < params.speed; i++) step();
  draw();
  if (frame++ % 10 === 0) { updateStats(); drawGraph(); }
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
